<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#15121d" />
    <meta name="description" content="طيفورا ، مختبر ألوان حي ثنائي اللغة لاستخراج وبناء لوحات الألوان داخل المتصفح بخصوصية مطلقة." />
    <!-- Open Graph / Social Media Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="طيفورا ، مختبر اللون الحي | TAYFORA" />
    <meta property="og:description" content="استخرج روح صورة، ابدأ من لون، ثم شكّل لوحة متوازنة وجاهزة للهوية والواجهة ، بلا رفع ملفاتك إلى أي خادم." />
    <meta property="og:image" content="/favicon.svg" />
    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="طيفورا ، مختبر اللون الحي | TAYFORA" />
    <meta name="twitter:description" content="استخرج روح صورة، ابدأ من لون، ثم شكّل لوحة متوازنة بخصوصية مطلقة." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@100..900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>طيفورا، مختبر اللون الحي</title>
    <script>
      try {
        var saved = localStorage.getItem("tayf.theme");
        var preferred = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = saved === "light" || saved === "dark" ? saved : preferred;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
